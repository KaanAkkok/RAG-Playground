[project]
name = "rag_playground"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "openai>=3.28.0",
    "docling-slim[format-pdf-docling,models-local]>=2.136.0",
    "pdfplumber>=0.11.10",
    "pydantic>=2.14.0",
    "pydantic-settings>=2.0.0",
    "qdrant-client>=1.19.1",
    "aiofiles>=25.1.0",
    "torch>=2.2.2",
    "torchvision>=0.29.1",
    "manimations",
    "rtree>=1.4.1",
    "opencv-python-headless>=5.0.0.93",
]

[project.scripts]
rag_playground = "rag_playground:main"

[build-system]
requires = ["uv_build>=0.12.2,<0.13.0"]
build-backend = "uv_build"

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
torchvision = { index = "pytorch-cpu" }
manimations = { workspace = true }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.workspace]
members = [
    "manimations",
]

[dependency-groups]
dev = [
    "black>=26.10.1",
    "ruff>=0.17.0",
]
notebook = [
    "ipykernel>=7.4.0",
    "ipywidgets>=8.1.9",
    "jupyterlab>=4.6.4",
    "notebook>=7.0.0",
    "sidecar>=0.7.0",
]
